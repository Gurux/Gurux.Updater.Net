name: Publish Gurux Updater NuGet packages
'on':
  push:
    branches:
    - main
    paths:
    - Development/Gurux.Updater.Net/**
    - Development/Gurux.Updater.Tool/**
    - Development/Gurux.Updater.png
    - Development/Gurux.Updater.ico
    - README.md
    - '**/Directory.Build.props'
    - '**/Directory.Build.targets'
    - '**/Directory.Packages.props'
    - '**/NuGet.Config'
    - '**/nuget.config'
    - '**/global.json'
  workflow_dispatch:
    inputs:
      version:
        description: Optional four-part version override; blank = automatic
        required: false
        type: string
      project:
        description: Library selection also publishes the tool
        required: true
        default: Gurux.Updater.Net
        type: choice
        options:
        - Gurux.Updater.Net
        - Gurux.Updater.Tool
permissions:
  contents: read
concurrency:
  group: gurux-updater-nuget-releases
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Gurux/Gurux.Updater.Net' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_CONFIGURATION: Release
      MAJOR_VERSION: '1'
      MINOR_VERSION: '0'
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Select packages
      id: select
      env:
        EVENT_NAME: ${{ github.event_name }}
        SELECTED_PROJECT: ${{ inputs.project }}
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.sha }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:EVENT_NAME -eq 'workflow_dispatch') {
          if ($env:SELECTED_PROJECT -notin @('Gurux.Updater.Net', 'Gurux.Updater.Tool')) { throw 'Unknown project.' }
          $library = $env:SELECTED_PROJECT -eq 'Gurux.Updater.Net'
          $tool = $true
        } else {
          if ($env:BEFORE_SHA -match '^0+$') {
            $files = @(git ls-tree -r --name-only $env:AFTER_SHA)
          } else {
            $files = @(git diff --name-only --no-renames $env:BEFORE_SHA $env:AFTER_SHA)
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not determine changed files.' }
          $shared = @($files | Where-Object {
            $_ -in @('README.md', 'Development/Gurux.Updater.png', 'Development/Gurux.Updater.ico') -or
            $_ -match '(^|/)(Directory\.Build\.(props|targets)|Directory\.Packages\.props|[Nn]u[Gg]et\.[Cc]onfig|global\.json)$'
          }).Count -gt 0
          $library = $shared -or @($files | Where-Object { $_.StartsWith('Development/Gurux.Updater.Net/') }).Count -gt 0
          $tool = $library -or @($files | Where-Object { $_.StartsWith('Development/Gurux.Updater.Tool/') }).Count -gt 0
        }
        $packages = @()
        if ($library) { $packages += 'Gurux.Updater.Net' }
        if ($tool) { $packages += 'Gurux.Updater.Tool' }
        "SELECTED_PACKAGES=$($packages -join ',')" >> $env:GITHUB_ENV
        "has_changes=$($packages.Count -gt 0)" >> $env:GITHUB_OUTPUT
        Write-Host "Selected: $($packages -join ', ')"
    - name: Determine release version
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
        NUGET_USER: ${{ vars.NUGET_USER }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
          throw 'Set the NUGET_USER GitHub Actions variable first.'
        }
        $version = ([string]$env:REQUESTED_VERSION).Trim()
        if ([string]::IsNullOrEmpty($version)) {
          $now = [DateTime]::UtcNow
          $prefix = "$env:MAJOR_VERSION.$env:MINOR_VERSION.$($now.ToString('yyMM'))"
          $revision = $now.Day * 100 + 1
          $versions = @()
          # Use both package histories to select one version for a coordinated release.
          foreach ($id in @('Gurux.Updater.Net', 'Gurux.Updater.Tool')) {
            $url = "https://api.nuget.org/v3-flatcontainer/$($id.ToLowerInvariant())/index.json"
            try {
              $response = Invoke-RestMethod $url -MaximumRetryCount 3 -RetryIntervalSec 5
              $versions += @($response.versions)
            } catch {
              if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
            }
          }
          $stable = @($versions | Where-Object { $_ -match '^\d+\.\d+\.\d+(\.\d+)?$' } |
            ForEach-Object { [version]$_ } | Sort-Object -Descending)
          if ($stable.Count -gt 0) {
            $latest = $stable[0]
            # Continue the latest stable package's major/minor series.
            $prefix = "$($latest.Major).$($latest.Minor).$($now.ToString('yyMM'))"
            $candidate = [version]"$prefix.$revision"
            if ($latest.Major -gt $candidate.Major -or
                ($latest.Major -eq $candidate.Major -and $latest.Minor -gt $candidate.Minor) -or
                ($latest.Major -eq $candidate.Major -and $latest.Minor -eq $candidate.Minor -and $latest.Build -gt $candidate.Build)) {
              throw "Latest version is $latest. Update MAJOR_VERSION/MINOR_VERSION or enter a manual version."
            }
            if ($latest.Major -eq $candidate.Major -and $latest.Minor -eq $candidate.Minor -and $latest.Build -eq $candidate.Build) {
              $revision = [Math]::Max($revision, $latest.Revision + 1)
            }
          }
          $version = "$prefix.$revision"
        }
        if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
          throw 'Use a four-part numeric version, for example 1.0.2611.201.'
        }
        foreach ($part in $version.Split('.')) {
          $number = 0
          if (-not [int]::TryParse($part, [ref]$number) -or $number -gt 65534) {
            throw 'Version components must be between 0 and 65534.'
          }
        }
        "BUILD_BUILDNUMBER=$version" >> $env:GITHUB_ENV
        "PACKAGE_OUTPUT=$env:GITHUB_WORKSPACE/artifacts/packages" >> $env:GITHUB_ENV
        Write-Host "Release version $version"
      if: steps.select.outputs.has_changes == 'True'
    - name: Build and pack selected projects
      run: |
        $ErrorActionPreference = 'Stop'
        foreach ($id in $env:SELECTED_PACKAGES.Split(',')) {
          $project = "Development/$id/$id.csproj"
          dotnet restore $project
          if ($LASTEXITCODE -ne 0) { throw "Restore failed: $id" }
          # Pack explicitly; do not implicitly pack ProjectReference dependencies.
          dotnet pack $project --configuration $env:BUILD_CONFIGURATION --no-restore `
            --output $env:PACKAGE_OUTPUT `
            "-p:Version=$env:BUILD_BUILDNUMBER" `
            "-p:PackageVersion=$env:BUILD_BUILDNUMBER" `
            '-p:GeneratePackageOnBuild=false' `
            '-p:ContinuousIntegrationBuild=true'
          if ($LASTEXITCODE -ne 0) { throw "Pack failed: $id" }
          $package = Join-Path $env:PACKAGE_OUTPUT "$id.$env:BUILD_BUILDNUMBER.nupkg"
          if (-not (Test-Path $package)) { throw "Package missing: $package" }
        }
      if: steps.select.outputs.has_changes == 'True'
    - name: NuGet login (Trusted Publishing)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ vars.NUGET_USER }}
      if: steps.select.outputs.has_changes == 'True'
    - name: Publish selected packages
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        $ErrorActionPreference = 'Stop'
        # Both packages are built before publication; publish the library first.
        foreach ($id in $env:SELECTED_PACKAGES.Split(',')) {
          $package = Join-Path $env:PACKAGE_OUTPUT "$id.$env:BUILD_BUILDNUMBER.nupkg"
          dotnet nuget push $package --api-key $env:NUGET_API_KEY `
            --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw "NuGet push failed: $id" }
          "Published $id $env:BUILD_BUILDNUMBER" >> $env:GITHUB_STEP_SUMMARY
        }
      if: steps.select.outputs.has_changes == 'True'
    - name: Create version tags
      run: |
        $ErrorActionPreference = 'Stop'
        foreach ($id in $env:SELECTED_PACKAGES.Split(',')) {
          $tag = "$id/v$env:BUILD_BUILDNUMBER"
          $existing = @(git tag --list $tag)
          if ($LASTEXITCODE -ne 0) { throw 'Could not read tags.' }
          if ($existing.Count -gt 0) {
            $target = git rev-list -n 1 $tag
            if ($LASTEXITCODE -ne 0 -or $target -ne $env:GITHUB_SHA) { throw "Tag points to a different commit: $tag" }
          } else {
            git tag $tag $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Tag creation failed: $tag" }
          }
          git push origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Tag push failed: $tag" }
        }
      if: steps.select.outputs.has_changes == 'True'
