name: Test module content packages

on:
  push:
    paths:
      - 'Development/Gurux.Updater.Net/**'
      - 'Development/Gurux.Updater.Tool/**'
      - 'Tests/ModuleContent.Tests/**'
      - '.github/workflows/module-content-tests.yml'
  pull_request:
    paths:
      - 'Development/Gurux.Updater.Net/**'
      - 'Development/Gurux.Updater.Tool/**'
      - 'Tests/ModuleContent.Tests/**'
      - '.github/workflows/module-content-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Development/Gurux.Updater.Tool -c Release -p:GeneratePackageOnBuild=false
      - run: dotnet test Tests/ModuleContent.Tests -c Release -p:GeneratePackageOnBuild=false
